apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: TimescaleDB
    uid: postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: iot
    user: iot
    secureJsonData:
      password: iot
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    editable: false
