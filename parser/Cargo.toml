[package]
name = "gateway_parser"
version = "0.2.0"
edition = "2021"

# либа — для Rustler NIF (вызывается из BEAM напрямую, без subprocess).
# бинарь — обратная совместимость (stdin->stdout) для эмулятора и офлайн-демо.
[lib]
name = "gateway_parser"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "iot-parser"
path = "src/main.rs"

[dependencies]
rustler = "0.38"
