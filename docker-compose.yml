services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot
      POSTGRES_DB: iot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      API_PORT: "8080"
      DATABASE_URL: postgres://iot:iot@postgres:5432/iot?sslmode=disable
      GATEWAY_URL: http://gateway:4000
      INGEST_TOKEN: dev-ingest-token
      JWT_SECRET: dev-jwt-secret-change-me
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      GATEWAY_PORT: "4000"
      API_URL: http://api:8080
      INGEST_TOKEN: dev-ingest-token
      MQTT_ENABLED: "false"
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      DISCOVERY_ENABLED: "false"
      DISCOVERY_SUBNET: 192.168.1.0/24
      DISCOVERY_INTERVAL_MS: "300000"
    ports:
      - "4000:4000"
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_AI_URL: http://localhost:8095
        VITE_MODBUS_URL: http://localhost:8090
    ports:
      - "80:80"
    depends_on:
      - api
      - gateway

  modbus-poller:
    build:
      context: .
      dockerfile: api/Dockerfile.modbus-poller
    environment:
      MODBUS_CONFIG: /etc/iot/modbus.json
    ports:
      - "8090:8090"
    volumes:
      - ./api/cmd/modbus-poller/modbus.example.json:/etc/iot/modbus.json
    depends_on:
      - api

  automation:
    build:
      context: .
      dockerfile: automation/Dockerfile
    environment:
      AUTOMATION_CONFIG: /etc/iot/automation.json
    volumes:
      - ./automation/automation.example.json:/etc/iot/automation.json
    depends_on:
      - api
      - modbus-poller

  alerts:
    build:
      context: .
      dockerfile: alerts/Dockerfile
    environment:
      ALERTS_CONFIG: /etc/iot/alerts.json
      # секреты — через env (переопределяют значение из alerts.json)
      TELEGRAM_TOKEN: ""
      TELEGRAM_CHAT: ""
      FCM_CREDENTIALS: ""
      FCM_TOPIC: "iot-alerts"
    volumes:
      - ./alerts/alerts.example.json:/etc/iot/alerts.json
    depends_on:
      - api

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    environment:
      AI_PORT: "8095"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.1
      DATABASE_URL: postgres://iot:iot@postgres:5432/iot?sslmode=disable
    ports:
      - "8095:8095"
    depends_on:
      - postgres
      - ollama

  # локальная LLM (опционально, подключается к ai-сервису)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  # MQTT-брокер для беспроводных датчиков (опционально)
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"

  # EcoPlanner: оптимизация нагрева бассейна по тарифам (Energy-Charts) и погоде
  eco:
    build:
      context: .
      dockerfile: eco/Dockerfile
    environment:
      API_URL: http://api:8080
      INGEST_TOKEN: dev-ingest-token
      ECO_DEVICE_ID: pool-heater
      OWM_API_KEY: ""
      OWM_CITY: Berlin
      ECO_BZN: DE-LU
      ECO_HEAT_HOURS: "4"
      ECO_INTERVAL: 30m
      ECO_PORT: "8096"
    ports:
      - "8096:8096"
    depends_on:
      - api

  # HomeKit-мост (HAP). Требует host-сети (Linux) — mDNS/Bonjour для пары с HomeKit.
  homekit:
    build:
      context: .
      dockerfile: homekit/Dockerfile
    network_mode: host
    environment:
      API_URL: http://localhost:8080
      HOMEBRIDGE_EMAIL: ""
      HOMEBRIDGE_PASSWORD: ""
      HOMEBRIDGE_PIN: "00102003"
      HOMEBRIDGE_STORE: /app/homekit-store
      HOMEBRIDGE_ADDR: ":51826"
    volumes:
      - homekit-store:/app/homekit-store
    depends_on:
      - api

  # ---- Мониторинг (Grafana из коробки) ----
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    ports:
      - "9100:9100"

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - node-exporter

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - postgres

volumes:
  pgdata:
  ollama:
  prometheus-data:
  grafana-data:
  homekit-store:
