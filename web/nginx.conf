server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
    }

    # вебсокеты гейтвея
    location /ws/ {
        proxy_pass http://gateway:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # spa-роутинг
    location / {
        try_files $uri $uri/ /index.html;
    }
}
