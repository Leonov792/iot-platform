name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  goreleaser:
    name: Go-бинари (api + эмулятор, 6 платформ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    name: Rust-парсер (${{ matrix.target }})
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            apt: gcc-arm-linux-gnueabihf
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross gcc
        if: ${{ matrix.apt != '' }}
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Build
        # сборка из parser/, чтобы cargo подхватил parser/.cargo/config.toml с arm-линкерами
        working-directory: parser
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          t="${{ matrix.target }}"
          if [ -f "parser/target/$t/release/iot-parser.exe" ]; then
            cp "parser/target/$t/release/iot-parser.exe" "iot-parser-$t.exe"
            gh release upload "$GITHUB_REF_NAME" "iot-parser-$t.exe" --clobber
          else
            cp "parser/target/$t/release/iot-parser" "iot-parser-$t"
            gh release upload "$GITHUB_REF_NAME" "iot-parser-$t" --clobber
          fi

  docker:
    name: Гейтвей docker (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker требует lowercase в имени образа, а github.repository может быть с заглавными
      - id: meta
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${repo}-gateway" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
