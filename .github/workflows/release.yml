name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  goreleaser:
    name: Go-бинари (api + эмулятор, 6 платформ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    name: Rust-парсер (6 платформ)
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: zig,cargo-zigbuild
      - name: Build
        run: |
          set -euo pipefail
          targets=(x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu armv7-unknown-linux-gnueabihf x86_64-apple-darwin aarch64-apple-darwin)
          for t in "${targets[@]}"; do
            cargo zigbuild --release --target "$t" --manifest-path parser/Cargo.toml
            cp "parser/target/$t/release/iot-parser" "iot-parser-$t"
          done
          # windows отдельно: там .exe и gnu-abi (zig не тянет msvc)
          cargo zigbuild --release --target x86_64-pc-windows-gnu --manifest-path parser/Cargo.toml
          cp "parser/target/x86_64-pc-windows-gnu/release/iot-parser.exe" "iot-parser-x86_64-pc-windows-gnu.exe"
      - name: Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" iot-parser-* --clobber

  docker:
    name: Гейтвей docker (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker требует lowercase в имени образа, а github.repository может быть с заглавными
      - id: meta
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${repo}-gateway" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
